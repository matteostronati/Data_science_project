version: "2.0"

rules:
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Handle stop intent
    steps:
      - intent: stop
      - action: utter_stop

  - rule: Reset slots on new search
    steps:
      - intent: new_search
      - action: action_reset_slots_with_message
      - action: utter_ask_newsearch