version: "2.0"
nlu:
  - intent: greet
    examples: |
      - hey
      - hello
      - hi
      - hello there
      - good morning
      - good evening
      - hey there
      - let's go
      - hey dude
      - goodmorning
      - goodevening
      - good afternoon
      - yo
      - hello world
      - hi there
  - intent: goodbye
    examples: |
      - cu
      - good by
      - cee you later
      - good night
      - bye
      - goodbye
      - have a nice day
      - see you around
      - bye bye
      - see you later
      - thanks, goodbye
  - intent: affirm
    examples: |
      - yes
      - y
      - indeed
      - of course
      - that sounds good
      - correct
      - /affirm
  - intent: deny
    examples: |
      - no
      - n
      - never
      - I don't think so
      - don't like that
      - no way
      - not really
  - intent: stop
    examples: |
      - stop
      - nevermind
      - please stop
      - i want to stop
      - stop the form

  - intent: new_search
    examples: |
      - start over
      - new search
      - search again
      - reset
      - clear filters
      - I want to search for something else
      - start a new search
      - forget everything
      - clear all

