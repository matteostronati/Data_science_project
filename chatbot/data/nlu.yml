version: "2.0"
nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning
    - good evening
    - hey there
    - let's go
    - hey dude
    - goodmorning
    - goodevening
    - good afternoon
    - yo
    - hello world
    - hi there
- intent: goodbye
  examples: |
    - cu
    - good by
    - cee you later
    - good night
    - bye
    - goodbye
    - have a nice day
    - see you around
    - bye bye
    - see you later
    - thanks, goodbye
- intent: affirm
  examples: |
    - yes
    - y
    - indeed
    - of course
    - that sounds good
    - correct
    - /affirm
- intent: deny
  examples: |
    - no
    - n
    - never
    - I don't think so
    - don't like that
    - no way
    - not really
- intent: stop
  examples: |
    - stop
    - nevermind
    - please stop
    - i want to stop
    - stop the form
- intent: find_book
  examples: |
    - I want a book 
    - I want something to read
    - I'm looking for something to read
    - suggest a book
    - can you recommend a book
    - I need a book recommendation
    - what book should I read
    - help me find a book
    - I'm searching for a good book
    - give me a book suggestion
    - looking for my next read
    - what should I read next
    - I want something new to read
    - can you suggest something
    - I'd like a book recommendation
    - find me a book to read
    - any book recommendations
    - show me some books
    - I need reading suggestions
- intent: specify_genre
  examples: |
    - I like [fiction](genre)
    - something in [fantasy](genre)
    - a [mystery](genre) book
    - [romance](genre) novels
    - I prefer [thriller](genre)
    - looking for [horror](genre)
    - [science fiction](genre) please
    - a [historical fiction](genre) would be nice
    - I enjoy [young adult](genre) books
    - [classics](genre) literature
    - [nonfiction](genre) books
    - something about [history](genre)
    - I want a book talking about [sports](genre)
