version: "3.1"

stories:
  - story: greet and search with multiple filters
    steps:
      - intent: greet
      - action: utter_greet
      - intent: specify_genre
        entities:
          - genre
      - action: action_search_books
      - intent: find_book_by_author
        entities:
          - author
      - action: action_search_books
      - intent: affirm
      - action: utter_ask_another
      - intent: affirm
      - action: action_reset_slots
      - action: utter_ask_genre

  - story: direct genre search
    steps:
      - intent: specify_genre
        entities:
          - genre
      - action: action_search_books

  - story: search by author
    steps:
      - intent: find_book_by_author
        entities:
          - author
      - action: action_search_books

  - story: search by title
    steps:
      - intent: find_book_by_title
        entities:
          - title
      - action: action_search_books

  - story: search by page range
    steps:
      - intent: find_book_by_page_range
        entities:
          - min_num_pages
          - max_num_pages
      - action: action_search_books

  - story: search by rating
    steps:
      - intent: find_book_by_rating_range
        entities:
          - min_avg_rating
      - action: action_search_books

  - story: search by character
    steps:
      - intent: find_book_by_character
        entities:
          - characters
      - action: action_search_books

  - story: user refines search with more criteria
    steps:
      - intent: specify_genre
        entities:
          - genre
      - action: action_search_books
      - intent: deny
      - action: utter_ask_more_info
      - intent: find_book_by_author
        entities:
          - author
      - action: action_search_books

  - story: user satisfied and wants another book
    steps:
      - intent: specify_genre
        entities:
          - genre
      - action: action_search_books
      - intent: affirm
      - action: utter_ask_another
      - intent: affirm
      - action: action_reset_slots
      - action: utter_ask_genre

  - story: user wants completely new search
    steps:
      - intent: new_search
      - action: action_reset_slots
      - action: utter_ask_genre

  - story: user not satisfied tries new search
    steps:
      - intent: specify_genre
        entities:
          - genre
      - action: action_search_books
      - intent: deny
      - action: utter_ask_more_info
      - intent: new_search
      - action: action_reset_slots
      - action: utter_ask_genre

  - story: simple goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
