version: "2.0"

stories:

- story: greet and find book by genre
  steps:
    - intent: greet
    - action: utter_greet
    - intent: find_book
    - action: utter_ask_genre
    - intent: specify_genre
      entities:
        - genre
    - action: action_recommend_book
    - intent: affirm
    - action: utter_ask_another
    - intent: goodbye
    - action: utter_goodbye

- story: direct genre search
  steps:
    - intent: specify_genre
      entities:
        - genre
    - action: action_recommend_book

- story: find book by author
  steps:
    - intent: greet
    - action: utter_greet
    - intent: find_book_by_author
      entities:
        - author
    - action: action_find_by_author
    - intent: goodbye
    - action: utter_goodbye

- story: find book by title
  steps:
    - intent: find_book_by_title
      entities:
        - title
    - action: action_find_by_title

- story: find book by page range
  steps:
    - intent: find_book_by_page_range
      entities:
        - min_num_pages
        - max_num_pages
    - action: action_find_by_page_range

- story: find book by exact pages
  steps:
    - intent: find_book_by_page
      entities:
        - num_pages
    - action: action_find_by_page

- story: find book by author and pages
  steps:
    - intent: find_books_by_author_and_page_range
      entities:
        - author
        - min_num_pages
    - action: action_find_by_author_and_pages

- story: find book by rating
  steps:
    - intent: find_book_by_rating_range
      entities:
        - min_avg_rating
    - action: action_find_by_rating

- story: find book by character
  steps:
    - intent: find_book_by_character
      entities:
        - characters
    - action: action_find_by_character

- story: user denies recommendation and wants another
  steps:
    - intent: specify_genre
      entities:
        - genre
    - action: action_recommend_book
    - intent: deny
    - action: utter_ask_more_info
    - intent: find_book_by_author
      entities:
        - author
    - action: action_find_by_author

- story: user stops search
  steps:
    - intent: find_book
    - action: utter_ask_genre
    - intent: stop
    - action: utter_stop

- story: simple goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- story: user not satisfied tries different genre
  steps:
    - intent: specify_genre
      entities:
        - genre
    - action: action_recommend_book
    - intent: deny
    - action: utter_ask_genre
    - intent: specify_genre
      entities:
        - genre
    - action: action_recommend_book

