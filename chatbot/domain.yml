version: '3.0'

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - stop
  - find_book
  - specify_genre

entities:
  - genre
  - author
  - title
  - year
  - max_num_pages
  - min_num_pages
  - rating

slots:
  genre:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: genre

responses:
  utter_greet:
    - text: "Hello! I'm here to help you find your next great book. What are you looking for?"
  
  utter_goodbye:
    - text: "Happy reading! Come back anytime you need a book recommendation."
  
  utter_iamabot:
    - text: "I am a book recommendation bot, powered by Rasa."
  
  utter_ask_preferences:
    - text: "What genre are you interested in? I can suggest Fiction, Fantasy, Mystery, Romance, Thriller, and many more!"

actions:
  - action_recommend_book

