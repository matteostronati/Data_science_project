    examples:
      - "Find books published between [2000](year_start) and [2010](year_end)."
      - "Show titles released from [1990](year_start) to [1999](year_end)."
      - "Search books published between [2015](year_start) and [2020](year_end)."
      - "Find books released from [1950](year_start) to [1970](year_end)."

