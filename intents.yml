      - "Show me titles in [Italian](language)."
      - "Search books written in [Spanish](language)."
      - "Find [French](language) books."

  - name: find_book_by_genre_and_language
    uses_entities: [genres, language]
    examples:
      - "Find [Fantasy](genres) books in [English](language)."
      - "Show [Romance](genres) titles in [Italian](language)."
      - "Search [Nonfiction](genres) in [Spanish](language)."
      - "Find [Science Fiction](genres) books in [English](language)."

  - name: find_book_by_isbn
    uses_entities: [isbn]
    examples:
      - "Find the book with ISBN [0439358078](isbn)."
      - "Search ISBN [0307474275](isbn)."
      - "Look up isbn [0140449132](isbn)."
      - "Can you find this ISBN: [0061120081](isbn)?"

  - name: find_book_by_isbn13
    uses_entities: [isbn13]
    examples:
      - "Find the book with ISBN13 [9780439358071](isbn13)."
      - "Search isbn13 [9780307474278](isbn13)."
      - "Look up ISBN-13 [9780140449136](isbn13)."
      - "isbn13: [9780061120084](isbn13)"

  - name: find_book_by_place
    uses_entities: [places]
    examples:
      - "Find books set in [London](places)."
      - "Show me books set in [England](places)."
      - "Search books that take place in [Hogwarts School of Witchcraft and Wizardry](places)."
      - "Find books set in [New York](places)."

