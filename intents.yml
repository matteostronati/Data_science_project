    examples:
      - "Find [Fantasy](genres) books that won the [Locus Award](awards)."
      - "Show [Horror](genres) titles with the [Bram Stoker Award](awards)."
      - "Search [Young Adult](genres) award-winning books ([Audie Award](awards))."
      - "Find [Mystery](genres) books with the [Anthony Award](awards)."

  - name: find_book_by_description_keywords
    uses_entities: [description]
    examples:
      - "Find books whose description mentions [time travel](description)."
      - "Search books described as [coming-of-age](description)."
      - "Find books with [wizard school](description) in the description."
      - "Show books that mention [political dystopia](description)."

  - name: find_book_by_publish_year
    uses_entities: [publish_date, year]
    examples:
      - "Find books published in [2004](year)."
      - "Show books released in [1997](year)."
      - "Search titles published in [2010](year)."
      - "Find books published in the year [2006](year)."

  - name: find_book_by_first_publish_year
    uses_entities: [first_publish_date, year]
    examples:
      - "Find books first published in [2003](year)."
      - "Show books originally published in [1954](year)."
      - "Search titles first published in [1813](year)."
      - "Find books with first publication year [1965](year)."

