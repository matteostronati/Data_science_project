    uses_entities: [min_num_pages, max_num_pages, num_pages]
    examples:
      - "Find books under [200](max_num_pages) pages."
      - "Show books with more than [500](min_num_pages) pages."
      - "Search books between [250](min_num_pages) and [400](max_num_pages) pages."
      - "Find short books (max [150](max_num_pages) pages)."

  - name: find_book_by_min_rating
    uses_entities: [min_avg_rating, avg_rating]
    examples:
      - "Find books with rating above [4.5](min_avg_rating)."
      - "Show books with an average rating of at least [4.2](min_avg_rating)."
      - "Search titles rated higher than [4.0](min_avg_rating)."
      - "Find highly rated books (min rating [4.6](min_avg_rating))."

  - name: find_book_by_rating_range
    uses_entities: [min_avg_rating, max_avg_rating, avg_rating]
    examples:
      - "Find books with rating between [4.0](min_avg_rating) and [4.3](max_avg_rating)."
      - "Show books rated from [3.5](min_avg_rating) to [4.0](max_avg_rating)."
      - "Search books in the rating range [4.4](min_avg_rating)-[4.8](max_avg_rating)."
      - "Find books with rating under [3.8](max_avg_rating)."

  - name: find_book_by_popularity_ratings
    uses_entities: [min_num_ratings, num_ratings]
    examples:
      - "Find books with at least [100000](min_num_ratings) ratings."
      - "Show very popular books (min ratings [500000](min_num_ratings))."
      - "Search books with more than [200000](min_num_ratings) ratings."
      - "Find books with at least [1000000](min_num_ratings) ratings."

  - name: find_book_by_popularity_reviews
    uses_entities: [min_num_reviews, num_reviews]
    examples:
      - "Find books with at least [5000](min_num_reviews) reviews."
      - "Show books with more than [10000](min_num_reviews) reviews."
      - "Search books with at least [20000](min_num_reviews) reviews."
      - "Find heavily reviewed books (min reviews [8000](min_num_reviews))."

  - name: find_book_by_rating_and_popularity
    uses_entities: [min_avg_rating, min_num_ratings, avg_rating, num_ratings]
    examples:
      - "Find books rated at least [4.3](min_avg_rating) with more than [200000](min_num_ratings) ratings."
      - "Show books with rating >= [4.5](min_avg_rating) and ratings >= [100000](min_num_ratings)."
      - "Search highly rated popular books (min rating [4.2](min_avg_rating), min ratings [300000](min_num_ratings))."
      - "Find books above [4.0](min_avg_rating) with at least [500000](min_num_ratings) ratings."

  - name: find_book_by_five_star_count
    uses_entities: [min_rated_5, rated_5]
    examples:
      - "Find books with at least [500000](min_rated_5) five-star ratings."
      - "Show books with more than [1000000](min_rated_5) 5-star votes."
      - "Search books with at least [200000](min_rated_5) five-star ratings."
      - "Find books with a huge number of 5-star ratings (min [750000](min_rated_5))."

  - name: find_book_with_sorting
    uses_entities: [sort_by, sort_order, limit]
    examples:
      - "Show top [10](limit) books sorted by [avg_rating](sort_by) [desc](sort_order)."
      - "List [20](limit) books ordered by [num_ratings](sort_by) [desc](sort_order)."
      - "Find [15](limit) newest books sorted by [publish_date](sort_by) [desc](sort_order)."
      - "Show [25](limit) books sorted by [num_reviews](sort_by) [desc](sort_order)."

  - name: find_books_by_author_and_language
    uses_entities: [author, language]
    examples:
