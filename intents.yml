      - "Show titles by [Gabriel García Márquez](author) in [Spanish](language)."
      - "Search books by [Umberto Eco](author) in [Italian](language)."
      - "Find books by [Albert Camus](author) in [French](language)."

  - name: find_books_by_author_and_year
    uses_entities: [author, year, publish_date]
    examples:
      - "Find books by [Stephen King](author) published in [1986](year)."
      - "Show books by [George Orwell](author) released in [1949](year)."
      - "Search titles by [J.K. Rowling](author) published in [2005](year)."
      - "Find books by [Agatha Christie](author) published in [1934](year)."