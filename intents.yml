intents:

  - name: find_book_by_title
    uses_entities: [title]
    examples:
      - "Find [Harry Potter and the Half-Blood Prince](title)."
      - "Search for the book titled [The Hobbit](title)."
      - "Do you have [1984](title)?"
      - "Look up [Pride and Prejudice](title)."

  - name: find_book_by_author
    uses_entities: [author]
    examples:
      - "Show me books by [J.K. Rowling](author)."
      - "Find novels written by [George Orwell](author)."
      - "Search titles from [Stephen King](author)."
      - "What books did [Agatha Christie](author) write?"

  - name: find_book_by_title_and_author
    uses_entities: [title, author]
    examples:
      - "Find [The Shining](title) by [Stephen King](author)."
      - "Look up [Dune](title) by [Frank Herbert](author)."
      - "Search for [The Great Gatsby](title) by [F. Scott Fitzgerald](author)."
      - "Find [The Hobbit](title) written by [J.R.R. Tolkien](author)."

  - name: find_book_by_series
    uses_entities: [series]
    examples:
      - "Find books in the series [Harry Potter #](series)."
      - "Show me the [The Lord of the Rings](series) series."
      - "Search titles from the series [A Song of Ice and Fire](series)."
      - "Find books in [Percy Jackson and the Olympians](series)."

  - name: find_book_by_genre
    uses_entities: [genres]
    examples:
      - "Find [Fantasy](genres) books."
      - "Show me [Science Fiction](genres) titles."
      - "Search for [Mystery](genres) novels."
      - "Find [Nonfiction](genres) books."

  - name: find_book_by_multiple_genres
    uses_entities: [genres]
    examples:
      - "Find books tagged [Fantasy](genres) and [Young Adult](genres)."
      - "Search [Thriller](genres) and [Mystery](genres) books."
      - "Show [Romance](genres) and [Fiction](genres) titles."
      - "Find [History](genres) and [Nonfiction](genres) books."

  - name: find_book_by_language
    uses_entities: [language]
    examples:
