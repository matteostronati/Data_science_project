      - "Show [Historical Fiction](genres) set in [England](places)."
      - "Search [Fantasy](genres) books set in [Ireland](places)."
      - "Find [Thriller](genres) set in [New York](places)."

  - name: find_book_by_character
    uses_entities: [characters]
    examples:
